name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Node.js and Yarn versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
        with:
          install_args: node yarn

      - uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('mise.toml', 'yarn.lock') }}

      - name: Install dependencies
        run: mise install:web

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn lint:types

      - name: Build
        run: mise build:web

  # Seed data mirrors production, so pull requests from forks can't change
  # it. Maintainers' branches live in this repository and aren't checked.
  seed-data:
    name: Seed data
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for seed data changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- 'seeds/*.csv')
          if [ -n "$changed" ]; then
            echo "Changed seed files:"
            echo "$changed"
            echo "::error title=Seed data can't be changed by pull request::The files in seeds/ are a copy of the production database, so changing them doesn't change pokedextracker.com. To report incorrect Pokémon data, please open an issue: https://github.com/pokedextracker/pokedextracker.com/issues/new"
            exit 1
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      # Same 9.4 line as production (9.4.7).
      postgres:
        image: postgres:9.4.26
        env:
          POSTGRES_DB: pokedex_tracker_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: pokedex_tracker_admin
        ports:
          - 9876:5432
        options: >-
          --health-cmd "pg_isready -U pokedex_tracker_admin"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_DEBUG: "false"
      # Points `mise test:go` at the service above instead of the local Docker
      # container the dev launcher would otherwise start.
      TEST_DATABASE_PORT: "9876"
    steps:
      - uses: actions/checkout@v7

      # Installs the tool versions pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}

      - name: Install dependencies
        run: mise install:go

      - name: Lint
        run: mise lint:go

      - name: Test
        run: mise test:go
