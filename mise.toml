[tools]
go = "1.20.5"
node = "18.16.0"
yarn = "1.22.19"
"github:air-verse/air" = "1.67.4"
"github:golangci/golangci-lint" = "1.53.3"

[env]
# Local secrets (deploy tokens, credentials for pulling data) live in .env,
# which is gitignored. A missing .env is fine. Use names that don't collide with
# the app's own config (DATABASE_*, PORT, etc.) so local dev never picks them up.
_.file = ".env"
# The frontend deploy script reads ROLLBAR_TOKEN from .env itself to upload
# source maps. Blank it here so the local API (which reads the same variable)
# doesn't report development errors to Rollbar.
ROLLBAR_TOKEN = ""

# === Build ===

[tasks.build]
description = "Build the API, migrations, and frontend"
depends = ["build:api", "build:web"]

[tasks."build:api"]
description = "Build the api and migrations binaries"
depends = ["install:go"]
env = { CGO_ENABLED = "0" }
run = [
  "go build -o ./build/api/api -installsuffix cgo ./cmd/api",
  "go build -o ./build/migrations/migrations -installsuffix cgo ./cmd/migrations",
]

[tasks."build:air"]
description = "Build development API binary (used by air)"
run = "go build -o ./build/api/api-air ./cmd/api"

[tasks."build:web"]
description = "Build the frontend into build/web"
depends = ["install:web"]
env = { NODE_ENV = "production" }
run = "yarn build"

[tasks.clean]
description = "Remove build artifacts"
run = [
  "go clean",
  "rm -rf ./build coverage.out",
]

[tasks."install:go"]
description = "Download Go module dependencies"
run = "go mod download"

[tasks."install:web"]
description = "Install frontend dependencies"
run = "yarn install --frozen-lockfile"

# === Dev Server ===
#
# These go through the dev launcher (cmd/dev), which shares one PostgreSQL
# container between worktrees, gives each worktree its own database, and picks
# free ports so several worktrees can run at once.

[tasks.start]
description = "Start the API with hot reload and the frontend dev server pointed at it"
run = "go run ./cmd/dev start"

[tasks."start:air"]
description = "Start just the API with hot reload"
run = "go run ./cmd/dev start air"

[tasks."start:api"]
description = "Start just the API, without hot reload"
run = "go run ./cmd/dev start api"

[tasks."start:web"]
description = "Start just the frontend dev server, using this worktree's running API"
run = "go run ./cmd/dev start web"

[tasks."start:web:staging"]
description = "Start just the frontend dev server, using the staging API"
run = "go run ./cmd/dev start web-staging"

# === Linting ===

[tasks.lint]
description = "Run all linters"
depends = ["lint:go", "lint:web"]

[tasks."lint:go"]
description = "Run Go linting"
# Per-worktree cache so concurrent worktrees don't trip golangci-lint's
# "parallel golangci-lint is running" lock against each other.
env = { GOLANGCI_LINT_CACHE = "{{config_root}}/tmp/golangci-lint-cache" }
run = "golangci-lint run"

[tasks."lint:web"]
description = "Run ESLint and TypeScript checks"
run = "yarn lint:all"

# === Testing ===

[tasks."test:go"]
description = "Run Go tests against this worktree's test database (extra args replace the default go test args)"
run = "go run ./cmd/dev test"

[tasks."test:cover"]
description = "Open coverage report in browser"
run = "go tool cover -html coverage.out"

[tasks."test:enforce"]
description = "Enforce the coverage threshold"
run = "./scripts/coverage.sh coverage.out"

[tasks.bench]
description = "Run benchmarks"
run = "go run ./cmd/dev test -run=XXX -bench=. -memprofile memprofile.out ./pkg/..."

# === Database ===

[tasks."db:migrate"]
description = "Run pending migrations on this worktree's database"
run = "go run ./cmd/dev db migrate"

[tasks."db:migrate:create"]
description = "Create a new migration"
usage = 'arg "<name>" help="Migration name"'
run = 'go run ./cmd/dev db create "$usage_name"'

[tasks."db:rollback"]
description = "Roll back the last batch of migrations on this worktree's database"
run = "go run ./cmd/dev db rollback"

[tasks."db:stop"]
description = "Stop the shared PostgreSQL container (its data is kept)"
run = "go run ./cmd/dev db stop"

[tasks."db:seed"]
description = "Replace this worktree's Pokemon, games, and dex data with seeds/ (keeps local users and dexes)"
run = "go run ./cmd/dev db seed"

[tasks."db:pull"]
description = "Refresh seeds/ from production (needs PRODUCTION_DATABASE_URL in the main checkout's .env)"
run = "go run ./cmd/dev db pull"

[tasks."db:reset"]
description = "Delete and recreate this worktree's database"
run = "go run ./cmd/dev db reset"

[tasks.clone]
description = "Copy the main checkout's database into this worktree"
usage = '''flag "--to-main" help="Copy this worktree's database into the main checkout instead"'''
run = '''
if [ "${usage_to_main:-false}" = "true" ]; then
  go run ./cmd/dev clone --to-main
else
  go run ./cmd/dev clone
fi
'''

[tasks.psql]
description = "Open psql against this worktree's database"
run = "go run ./cmd/dev psql"

[tasks."psql:test"]
description = "Open psql against this worktree's test database"
run = "go run ./cmd/dev psql --test"

# === Deploys ===

[tasks."deploy:api"]
description = "Deploy the API to Fly.io (staging, then production after a prompt)"
run = "./scripts/deploy-api.sh"

[tasks."deploy:web"]
description = "Deploy the frontend to Fly.io (staging, then production after a prompt)"
run = "./scripts/deploy.sh"

# === Other ===

[tasks.setup]
description = "Install tools and dependencies, start PostgreSQL, and create and migrate this worktree's databases"
run = [
  "mise install",
  "mise install:go",
  "mise install:web",
  "go run ./cmd/dev setup",
]
