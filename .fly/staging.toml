# The site: API, frontend, and blog proxy in one binary.
# Docs: https://fly.io/docs/reference/configuration/

app = "pokedextracker-staging"
primary_region = "sjc"

[deploy]
  release_command = "migrations migrate"
  # New machines come up and pass their health check before traffic moves,
  # so a deploy never takes the site down.
  strategy = "bluegreen"

[env]
  ENVIRONMENT = "staging"

[http_service]
  internal_port = 8647
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "10s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
