name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Node.js and pnpm versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm

      - uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Install dependencies
        run: mise install:web

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm lint:prettier

      - name: Type check
        run: pnpm lint:types

      - name: Build
        run: mise build:web

  # Seed data mirrors production, so pull requests from forks can't change
  # it. Maintainers' branches live in this repository and aren't checked.
  seed-data:
    name: Seed data
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # HEAD is the PR merged into its base, so its first parent is exactly
      # the base it was built on.
      - name: Check for seed data changes
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD -- 'seeds/*.csv')
          if [ -n "$changed" ]; then
            echo "Changed seed files:"
            echo "$changed"
            echo "::error title=Seed data can't be changed by pull request::The files in seeds/ are a copy of the production database, so changing them doesn't change pokedextracker.com. To report incorrect Pokémon data, please open an issue: https://github.com/pokedextracker/pokedextracker.com/issues/new"
            exit 1
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      # Same 9.4 line as production (9.4.7).
      postgres:
        image: postgres:9.4.26
        env:
          POSTGRES_DB: pokedex_tracker_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: pokedex_tracker_admin
        ports:
          - 9876:5432
        options: >-
          --health-cmd "pg_isready -U pokedex_tracker_admin"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_DEBUG: "false"
      # Points `mise test:go` at the service above instead of the local Docker
      # container the dev launcher would otherwise start.
      TEST_DATABASE_PORT: "9876"
    steps:
      - uses: actions/checkout@v7

      # Installs the tool versions pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}

      - name: Install dependencies
        run: mise install:go

      - name: Lint
        run: mise lint:go

      - name: Test
        run: mise test:go

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Installs the Go, Node.js, and pnpm versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
        with:
          install_args: go node pnpm

      - uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      # Its own key, since this job builds ./cmd/api, which the Backend job's
      # cache doesn't hold.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-e2e-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}

      - name: Install dependencies
        run: |
          mise install:go
          mise install:web
          echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"

      # The browsers only change with the Playwright version.
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      # The cache only holds the browsers, so the system libraries they need
      # are installed either way.
      - name: Install browsers
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium firefox webkit
          else
            mise install:browsers -- --with-deps
          fi

      # The dev launcher starts PostgreSQL in Docker, the same as locally.
      - name: Test
        run: mise test:e2e:all

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            build/e2e/server.log
          retention-days: 14

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Builds the image without pushing it, to catch packaging breakage
      # before a deploy does.
      - name: Build the image
        run: docker build --build-arg VERSION=ci .
