version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    # Replaces exportloopref: since Go 1.22, each loop iteration gets its own
    # variable, so the copies it asked for are now unnecessary.
    - copyloopvar
    - dogsled
    - err113
    - errcheck
    - exhaustive
    - gocritic
    - godot
    - goheader
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    # Also runs what gosimple and stylecheck used to.
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace

  settings:
    gocritic:
      disabled-checks:
        - appendAssign
        - ifElseChain
        - singleCaseSwitch
    gosec:
      excludes:
        - G108 # Profiling endpoint is automatically exposed
        - G401 # Use of weak cryptographic primitive
        - G404 # Use of weak random number generator
        - G501 # Blocklisted import crypto/md5

  exclusions:
    # The exclusions v1 applied by default.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # It's complaining about InsecureSkipVerify being set to true, but we are
      # setting it to true intentionally if the host is localhost.
      - path: pkg/database/database.go
        text: G402 # checking for InsecureSkipVerify
      # The dev launcher's errors are printed straight to a terminal rather than
      # matched by callers, so sentinel errors would only add noise.
      - path: (cmd/dev|internal/devtool)/
        linters:
          - err113
        text: do not define dynamic errors
      # Ignore a bunch of linters for test files.
      - path: _test\.go
        linters:
          - err113
          - errcheck
          - gosec
          - noctx
      # The tableName struct field is used by go-pg, even if we don't use it
      # directly.
      - linters:
          - unused
        text: tableName

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - goimports
