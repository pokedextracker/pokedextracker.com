# pnpm runs dependencies' install scripts only when they're listed here.
allowBuilds:
  # Sass's file watcher. Sass still comes in as Vite's optional peer, though
  # nothing uses it. Its script only compiles the watcher from source when no
  # prebuilt binary matches the platform, and every platform we build on has
  # one.
  "@parcel/watcher": false
  # The deploy script's source map uploader. Its script only downloads the
  # binary when the platform package (@sentry/cli-darwin, -linux-x64, etc.)
  # didn't install, and every platform we deploy from has one.
  "@sentry/cli": false
